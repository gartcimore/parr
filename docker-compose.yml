services:

############################
# DOCKER SOCKET PROXY
############################
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: socket-proxy
    environment:
      - CONTAINERS=1
      - SERVICES=1
      - NETWORKS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket_proxy
    restart: unless-stopped

############################
# TRAEFIK
############################
  traefik:
    image: traefik:v3.0
    container_name: traefik
    command:
      - --api.dashboard=true
      # Dashboard is NOT served insecurely on :8080 anymore. It is exposed only
      # via the authenticated HTTPS route below (https://heimdall.${DOMAIN}).
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ${CERTS_DIR}:/certs:ro
    # Required so the parr-webhook dynamic config (traefik/dynamic/webhook.yml)
    # can reach the host-side webhook daemon via http://host.docker.internal:9000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - traefik
      - socket_proxy
    labels:
      - "traefik.enable=true"
      # Traefik dashboard at https://heimdall.${DOMAIN}, LAN-only, basic auth.
      # The router targets the built-in api@internal service.
      - "traefik.http.routers.dashboard.rule=Host(`heimdall.${DOMAIN}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.service=api@internal"
      # Basic-auth middleware is defined in the file provider
      # (traefik/dynamic/dashboard-auth.yml) so the password hash is not subject
      # to Compose $-interpolation and needs no escaping.
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth@file"
      # Redirect plain HTTP on the dashboard hostname to HTTPS
      - "traefik.http.routers.dashboard-http.rule=Host(`heimdall.${DOMAIN}`)"
      - "traefik.http.routers.dashboard-http.entrypoints=web"
      - "traefik.http.routers.dashboard-http.middlewares=redirect-https@file"
    restart: unless-stopped

############################
# PROWLARR
############################
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ${DOCKER_CONFIG_DIR}/prowlarr/data:/config
    ports:
      - 9696:9696
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`${HOSTNAME}`) && PathPrefix(`/prowlarr`)"
      - "traefik.http.routers.prowlarr.entrypoints=web"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "traefik.http.middlewares.prowlarr-headers.headers.customrequestheaders.X-Forwarded-Proto=http"
      - "traefik.http.middlewares.prowlarr-headers.headers.customrequestheaders.X-Forwarded-Host=${HOSTNAME}"
      - "traefik.http.middlewares.prowlarr-headers.headers.customrequestheaders.X-Forwarded-Prefix=/prowlarr"
      - "traefik.http.routers.prowlarr.middlewares=prowlarr-headers"
      # Hostname-based HTTPS route: https://prowlarr.${DOMAIN}
      - "traefik.http.routers.prowlarr-tls.rule=Host(`prowlarr.${DOMAIN}`)"
      - "traefik.http.routers.prowlarr-tls.entrypoints=websecure"
      - "traefik.http.routers.prowlarr-tls.tls=true"
      - "traefik.http.routers.prowlarr-tls.service=prowlarr"
      - "traefik.http.routers.prowlarr-http.rule=Host(`prowlarr.${DOMAIN}`)"
      - "traefik.http.routers.prowlarr-http.entrypoints=web"
      - "traefik.http.routers.prowlarr-http.middlewares=redirect-https@file"
    restart: unless-stopped

