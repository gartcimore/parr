############################
# JELLYFIN	
############################

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin 
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=http://${HOSTNAME}/jellyfin
    volumes:
      - ${DOCKER_CONFIG_DIR}/jellyfin:/config
      - ${DATA_DIR}/media:/mediaYmir
      - /mnt/data/media:/mediaDrogo
    ports:
      - 8096:8096
      - 8920:8920 #optional
      - 7359:7359/udp #optional
      - 1900:1900/udp #optional
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      # Path-based HTTP route: http://${HOSTNAME}/jellyfin
      - "traefik.http.routers.jellyfin.rule=Host(`${HOSTNAME}`) && (PathPrefix(`/jellyfin`))"
      - "traefik.http.routers.jellyfin.entrypoints=web"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      - "traefik.http.middlewares.jellyfin-headers.headers.customrequestheaders.X-Forwarded-Proto=http"
      - "traefik.http.middlewares.jellyfin-headers.headers.customrequestheaders.X-Forwarded-Host=${HOSTNAME}"
      # - "traefik.http.middlewares.jellyfin-headers.headers.customrequestheaders.X-Forwarded-For=127.0.0.1"
      - "traefik.http.middlewares.jellyfin-headers.headers.customrequestheaders.X-Forwarded-Prefix=/jellyfin"
      - "traefik.http.routers.jellyfin.middlewares=jellyfin-headers"
      # Hostname-based HTTPS route: https://jellyfin.${DOMAIN} (uses wildcard cert from acme)
      - "traefik.http.routers.jellyfin-tls.rule=Host(`jellyfin.${DOMAIN}`)"
      - "traefik.http.routers.jellyfin-tls.entrypoints=websecure"
      - "traefik.http.routers.jellyfin-tls.tls=true"
      - "traefik.http.routers.jellyfin-tls.service=jellyfin"
      # Redirect plain HTTP on the hostname to HTTPS
      - "traefik.http.routers.jellyfin-http.rule=Host(`jellyfin.${DOMAIN}`)"
      - "traefik.http.routers.jellyfin-http.entrypoints=web"
      - "traefik.http.routers.jellyfin-http.middlewares=redirect-https@file"
    restart: unless-stopped

############################
# SEERR
############################
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
    volumes:
      - ${DOCKER_CONFIG_DIR}/seerr:/app/config
    ports:
      - 5055:5055
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seerr.rule=Host(`${HOSTNAME}`) && PathPrefix(`/seerr`)"
      - "traefik.http.routers.seerr.entrypoints=web"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"
      - "traefik.http.middlewares.seerr-stripprefix.stripprefix.prefixes=/seerr"
      - "traefik.http.middlewares.seerr-headers.headers.customrequestheaders.X-Forwarded-Proto=http"
      - "traefik.http.middlewares.seerr-headers.headers.customrequestheaders.X-Forwarded-Host=${HOSTNAME}"
      - "traefik.http.middlewares.seerr-headers.headers.customrequestheaders.X-Forwarded-Prefix=/seerr"
      - "traefik.http.routers.seerr.middlewares=seerr-headers,seerr-stripprefix"
      # Hostname-based HTTPS route: https://seerr.${DOMAIN} (served at root, no stripprefix)
      - "traefik.http.routers.seerr-tls.rule=Host(`seerr.${DOMAIN}`)"
      - "traefik.http.routers.seerr-tls.entrypoints=websecure"
      - "traefik.http.routers.seerr-tls.tls=true"
      - "traefik.http.routers.seerr-tls.service=seerr"
      - "traefik.http.routers.seerr-http.rule=Host(`seerr.${DOMAIN}`)"
      - "traefik.http.routers.seerr-http.entrypoints=web"
      - "traefik.http.routers.seerr-http.middlewares=redirect-https@file"
    restart: unless-stopped

############################
# HOMARR
############################
  homarr:
      image: ghcr.io/homarr-labs/homarr:latest
      container_name: homarr
      environment:
        - SECRET_ENCRYPTION_KEY=${HOMARR_SECRET_KEY}
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock # Optional, only if you want docker integration
        - ${DOCKER_CONFIG_DIR}/homarr:/appdata
      ports:
        - '7575:7575'
      networks:
        - traefik
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.homarr.rule=Host(`${HOSTNAME}`) && PathPrefix(`/homarr`)"
        - "traefik.http.routers.homarr.entrypoints=web"
        - "traefik.http.services.homarr.loadbalancer.server.port=7575"
        # - "traefik.http.middlewares.homarr-headers.headers.customrequestheaders.X-Forwarded-Proto=http"
        # - "traefik.http.middlewares.homarr-headers.headers.customrequestheaders.X-Forwarded-Host=${HOSTNAME}"
        # - "traefik.http.middlewares.homarr-headers.headers.customrequestheaders.X-Forwarded-For=127.0.0.1"
        - "traefik.http.middlewares.homarr-headers.headers.customrequestheaders.X-Forwarded-Prefix=/homarr"
        - "traefik.http.routers.homarr.middlewares=homarr-headers"
        # Hostname-based HTTPS route: https://homarr.${DOMAIN}
        - "traefik.http.routers.homarr-tls.rule=Host(`homarr.${DOMAIN}`)"
        - "traefik.http.routers.homarr-tls.entrypoints=websecure"
        - "traefik.http.routers.homarr-tls.tls=true"
        - "traefik.http.routers.homarr-tls.service=homarr"
        - "traefik.http.routers.homarr-http.rule=Host(`homarr.${DOMAIN}`)"
        - "traefik.http.routers.homarr-http.entrypoints=web"
        - "traefik.http.routers.homarr-http.middlewares=redirect-https@file"
      restart: unless-stopped

############################
# GLUETUN
############################

  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8080:8080/tcp # qbittorrent
    environment:
      - TZ=${TZ}
      - UPDATER_PERIOD=24h
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=${VPN_TYPE}
      - BLOCK_MALICIOUS=off
      - BLOCK_SURVEILLANCE=off
      - BLOCK_ADS=off
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - OPENVPN_CIPHERS=AES-256-GCM
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING=on
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"apikey","apikey":"${GLUETUN_API_KEY}"}
      # - DOT=off
      # - DNS_KEEP_NAMESERVER=on
    volumes:
      - ${DOCKER_CONFIG_DIR}/gluetun:/gluetun
    networks:
      - traefik
    labels:
    #  - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.rule=Host(`${HOSTNAME}`) && PathPrefix(`/qbittorrent`)"
      - "traefik.http.routers.qbittorrent.entrypoints=web"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.qbittorrent-stripprefix.stripprefix.prefixes=/qbittorrent"
      - "traefik.http.routers.qbittorrent.middlewares=qbittorrent-stripprefix"
    restart: unless-stopped


############################
# QBITTORRENT		
############################
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ${DOCKER_CONFIG_DIR}/qbittorrent:/config
      - ${DATA_DIR}/downloads:/downloads
    restart: unless-stopped
    network_mode: "service:gluetun"

############################
# GLUETUN-QBT-WATCHDOG
############################
  gluetun-qbt-watchdog:
    image: ghcr.io/brunoorsolon/gluetun-qbt-watchdog:latest
    container_name: gluetun-qbt-watchdog
    restart: unless-stopped
    networks:
      - traefik
    depends_on:
      - gluetun
      - qbittorrent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - GLUETUN_API=http://gluetun:8000
      - GLUETUN_API_KEY=${GLUETUN_API_KEY}
      - GLUETUN_CONTAINER_NAME=gluetun
      - QBT_API=http://gluetun:8080
      - QBT_USER=${QBT_USER}
      - QBT_PASS=${QBT_PASS}
      - QBT_API_KEY=${QBT_API_KEY:-}
      - QBT_AUTH_MODE=${QBT_AUTH_MODE:-auto}
      - QBT_CONTAINER_NAME=qbittorrent
      - CHECK_INTERVAL=60
      - HEARTBEAT_CYCLE_FREQUENCY=10
      - TZ=${TZ}

############################
# CALIBRE-WEB-AUTOMATED (ebooks)
############################
  calibre-web-automated:
    image: crocodilestick/calibre-web-automated:latest
    container_name: calibre-web-automated
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      # Library lives on the Ymir NFS share; disable WAL to avoid SQLite locking.
      - NETWORK_SHARE_MODE=true
      - CWA_PORT_OVERRIDE=8083
    volumes:
      - ${DOCKER_CONFIG_DIR}/calibre-web-automated:/config
      # Ingest: files dropped here are imported then DELETED. qBittorrent copies
      # completed ebooks into downloads/ebooks-ingest (separate from the seeding
      # downloads/ebooks category dir), so seeding is never disturbed.
      - ${DATA_DIR}/downloads/ebooks-ingest:/cwa-book-ingest
      # Library: fresh folder on the media share, alongside tv/movies.
      - ${DATA_DIR}/media/ebooks:/calibre-library
    ports:
      - 8083:8083
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.calibre.rule=Host(`${HOSTNAME}`) && PathPrefix(`/calibre`)"
      - "traefik.http.routers.calibre.entrypoints=web"
      - "traefik.http.services.calibre.loadbalancer.server.port=8083"
      - "traefik.http.middlewares.calibre-stripprefix.stripprefix.prefixes=/calibre"
      - "traefik.http.routers.calibre.middlewares=calibre-stripprefix"
      # Hostname-based HTTPS route: https://books.${DOMAIN}
      - "traefik.http.routers.calibre-tls.rule=Host(`books.${DOMAIN}`)"
      - "traefik.http.routers.calibre-tls.entrypoints=websecure"
      - "traefik.http.routers.calibre-tls.tls=true"
      - "traefik.http.routers.calibre-tls.service=calibre"
      - "traefik.http.routers.calibre-http.rule=Host(`books.${DOMAIN}`)"
      - "traefik.http.routers.calibre-http.entrypoints=web"
      - "traefik.http.routers.calibre-http.middlewares=redirect-https@file"
    restart: unless-stopped

############################
# NETWORKS
############################
networks:
  traefik:
    driver: bridge
    external: false
  socket_proxy:
    driver: bridge
    internal: true
    external: false